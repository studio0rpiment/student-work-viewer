<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>👓</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Link previews (crawlers don't run the app, so one image for the whole site). -->
    <meta name="description" content="Experimental Tools and Technology F26 — student work and assignments." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="classes" />
    <meta property="og:title" content="Experimental Tools and Technology F26" />
    <meta property="og:description" content="CDES 3110/6110 · student work and assignments" />
    <meta property="og:image" content="https://gwdesign.kevinpatton.site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://gwdesign.kevinpatton.site/og.png" />
    <!-- Inline so the loader is right before any CSS or JS arrives; React replaces #root's contents on mount. -->
    <style>
      html, body { margin: 0; background: #111613; }
    </style>
  </head>
  <body>
    <div id="root" data-pair-gallery><div class="loading" role="status" aria-label="loading"><span aria-hidden="true">👓</span></div></div>
    <style>
      /* Rotating glasses, light on dark: the emoji is drawn in greyscale and inverted. */
      .loading { position: fixed; inset: 0; display: grid; place-items: center; background: #111613; }
      .loading span { font-size: 2rem; line-height: 1; filter: grayscale(1) invert(1); animation: loading-spin 1.6s linear infinite; }
      @keyframes loading-spin { to { rotate: 360deg; } }
      @media (prefers-reduced-motion: reduce) { .loading span { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
